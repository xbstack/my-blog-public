<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="t d"><title id="t">流式中断导致 400 的完整链路</title><desc id="d">从观察到 function_call 到 Stream Abort、Conversation 未提交和下一轮 400 的五步链路</desc><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset="1" stop-color="#071a33"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1440" height="900" fill="url(#b)"/><text x="720" y="88" text-anchor="middle" fill="#fff" font-size="54" font-family="Arial,'Noto Sans SC',sans-serif" font-weight="800">为什么会报 400 “No tool call found…”？</text><text x="720" y="140" text-anchor="middle" fill="#94a3b8" font-size="27" font-family="Arial,'Noto Sans SC',sans-serif">看到 function_call / call_id ≠ 已提交到 Conversation</text><g font-family="Arial,'Noto Sans SC',sans-serif"><g fill="#06162e" stroke="#2563eb" stroke-width="3"><rect x="30" y="225" width="245" height="400" rx="24"/><rect x="315" y="225" width="245" height="400" rx="24" stroke="#fb5b45"/><rect x="600" y="225" width="245" height="400" rx="24"/><rect x="885" y="225" width="245" height="400" rx="24"/><rect x="1170" y="225" width="240" height="400" rx="24" stroke="#fb5b45"/></g><g fill="#fff" font-size="30" font-weight="700" text-anchor="middle"><text x="152" y="285">1 流式事件已看到</text><text x="438" y="285" fill="#fb5b45">2 Stream Abort</text><text x="722" y="285">3 Conversation 未提交</text><text x="1007" y="285">4 下一轮提交 Output</text><text x="1290" y="285" fill="#fb5b45">5 返回 400</text></g><g fill="#cbd5e1" font-size="24" text-anchor="middle"><text x="152" y="370">response.output_item.added</text><text x="152" y="420">function_call</text><text x="152" y="470">call_id</text><text x="438" y="395">在 response 完成前</text><text x="438" y="440">连接被中断</text><text x="722" y="390">Items 中找不到</text><text x="722" y="440">对应 call_id</text><text x="1007" y="390">function_call_output</text><text x="1007" y="440">引用旧 call_id</text><text x="1290" y="390">No tool call found</text><text x="1290" y="435">for function call output</text></g><g stroke="#38bdf8" stroke-width="5" filter="url(#g)"><path d="M275 425H315"/><path d="M560 425H600"/><path d="M845 425H885"/><path d="M1130 425H1170"/></g><path d="M418 335l35 55-28 45 35 52-31 60" fill="none" stroke="#fb5b45" stroke-width="10" filter="url(#g)"/></g><rect x="90" y="700" width="1260" height="120" rx="24" fill="#06162e" stroke="#2563eb" stroke-width="2"/><text x="720" y="760" text-anchor="middle" fill="#fbbf24" font-size="38" font-family="Arial,'Noto Sans SC',sans-serif" font-weight="800">核心原则：先对账，再执行；副作用必须做业务幂等。</text><text x="720" y="802" text-anchor="middle" fill="#cbd5e1" font-size="24" font-family="Arial,'Noto Sans SC',sans-serif">找不到 call_id：丢弃旧调用并重新发起模型轮次，不要盲目重试旧 Output</text></svg>