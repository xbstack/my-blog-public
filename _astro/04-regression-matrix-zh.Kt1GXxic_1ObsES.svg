<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="t d"><title id="t">流式中断回归测试矩阵</title><desc id="d">四个中断点对应 Conversation、工具副作用和下一轮结果</desc><rect width="1440" height="900" fill="#020617"/><text x="720" y="82" text-anchor="middle" fill="#fff" font-size="54" font-family="Arial,'Noto Sans SC',sans-serif" font-weight="800">怎样验证修复没有制造孤儿副作用？</text><text x="720" y="130" text-anchor="middle" fill="#94a3b8" font-size="26" font-family="Arial,'Noto Sans SC',sans-serif">同一套故障矩阵同时检查 Conversation、业务账本与外部系统</text><g font-family="Arial,'Noto Sans SC',sans-serif"><rect x="80" y="205" width="1280" height="500" rx="24" fill="#06162e" stroke="#2563eb" stroke-width="2"/><g fill="#0d2447"><rect x="80" y="205" width="1280" height="90" rx="24"/></g><g fill="#fff" font-size="25" font-weight="700" text-anchor="middle"><text x="220" y="260">中断点</text><text x="500" y="260">Conversation 有 call</text><text x="750" y="260">工具副作用</text><text x="990" y="260">旧 Output</text><text x="1220" y="260">结论</text></g><g stroke="#334155" stroke-width="2"><path d="M80 295H1360M80 395H1360M80 495H1360M80 595H1360"/><path d="M350 205V705M640 205V705M860 205V705M1110 205V705"/></g><g font-size="24" text-anchor="middle"><g fill="#cbd5e1"><text x="220" y="355">output_item.added 后</text><text x="220" y="455">arguments.done 后</text><text x="220" y="555">response.completed 后</text><text x="220" y="655">重复投递 2 次</text></g><g fill="#fb5b45"><text x="500" y="355">必须实测</text><text x="500" y="455">必须实测</text></g><text x="500" y="555" fill="#22c55e">应存在</text><text x="500" y="655" fill="#22c55e">应存在</text><text x="750" y="355" fill="#22c55e">0</text><text x="750" y="455" fill="#22c55e">0</text><text x="750" y="555" fill="#22c55e">1</text><text x="750" y="655" fill="#22c55e">1（幂等后）</text><text x="990" y="355" fill="#fbbf24">按实测填写</text><text x="990" y="455" fill="#fbbf24">按实测填写</text><text x="990" y="555" fill="#22c55e">接受</text><text x="990" y="655" fill="#22c55e">复用结果</text><text x="1220" y="355" fill="#fb5b45">未提交不得执行</text><text x="1220" y="455" fill="#fb5b45">未提交不得执行</text><text x="1220" y="555" fill="#22c55e">基线</text><text x="1220" y="655" fill="#22c55e">Exactly-once 业务效果</text></g></g><rect x="130" y="755" width="1180" height="95" rx="22" fill="#071a33" stroke="#2563eb" stroke-width="2"/><text x="720" y="805" text-anchor="middle" fill="#fbbf24" font-size="33" font-family="Arial,'Noto Sans SC',sans-serif" font-weight="800">升级 SDK、修改代理超时或前端取消逻辑后，都应重跑同一矩阵。</text><text x="720" y="837" text-anchor="middle" fill="#cbd5e1" font-size="21" font-family="Arial,'Noto Sans SC',sans-serif">单元测试验证应用状态机；真实 API 集成测试验证当前服务端提交边界</text></svg>