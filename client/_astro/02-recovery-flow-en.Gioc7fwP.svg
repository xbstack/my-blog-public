<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="t d"><title id="t">Safe recovery after a stream abort</title><desc id="d">Reconcile Conversation Items before executing or reusing a side-effecting tool result</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset="1" stop-color="#071a33"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#38bdf8"/></marker></defs><rect width="1440" height="900" fill="url(#bg)"/><text x="720" y="80" text-anchor="middle" fill="#fff" font-size="54" font-family="Arial,sans-serif" font-weight="800">How to Recover Safely After a Stream Abort</text><text x="720" y="126" text-anchor="middle" fill="#94a3b8" font-size="27" font-family="Arial,sans-serif">Reconcile first. Execute side effects only after the call is durable.</text><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#06162e" stroke="#2563eb" stroke-width="3"><rect x="90" y="205" width="330" height="100" rx="20"/><rect x="90" y="345" width="330" height="100" rx="20"/><rect x="520" y="480" width="330" height="100" rx="20"/><rect x="520" y="620" width="330" height="100" rx="20"/><rect x="930" y="205" width="330" height="100" rx="20"/><rect x="930" y="345" width="330" height="100" rx="20"/><rect x="930" y="485" width="330" height="100" rx="20"/></g><g fill="#fff" font-size="28" font-weight="700"><text x="255" y="265">Observed streamed function_call</text><text x="255" y="405">Check Conversation Items for call_id</text><text x="685" y="540">Discard stale call_id</text><text x="685" y="680">Start a new model turn</text><text x="1095" y="265">Reserve business idempotency key</text><text x="1095" y="405">Execute or reuse tool result</text><text x="1095" y="545">Submit function_call_output</text></g><polygon points="255,485 355,565 255,645 155,565" fill="#06162e" stroke="#38bdf8" stroke-width="3"/><text x="255" y="555" fill="#fff" font-size="27" font-weight="700">call_id</text><text x="255" y="590" fill="#fff" font-size="27" font-weight="700">present?</text><g stroke="#38bdf8" stroke-width="5" marker-end="url(#a)"><path d="M255 305V337"/><path d="M255 445V477"/><path d="M355 565H922"/><path d="M1095 305V337"/><path d="M1095 445V477"/></g><g stroke="#fb5b45" stroke-width="5" marker-end="url(#a)"><path d="M255 645V472" transform="translate(430 0)"/><path d="M685 580V612"/></g><text x="510" y="540" fill="#fb5b45" font-size="27" font-family="Arial" font-weight="700">NO</text><text x="575" y="545" fill="#38bdf8" font-size="27" font-family="Arial" font-weight="700">YES</text></g><rect x="110" y="780" width="1220" height="80" rx="20" fill="#06162e" stroke="#2563eb" stroke-width="2"/><text x="720" y="830" text-anchor="middle" fill="#fbbf24" font-size="33" font-family="Arial,sans-serif" font-weight="800">Rule: durable call first, idempotent execution second.</text></svg>