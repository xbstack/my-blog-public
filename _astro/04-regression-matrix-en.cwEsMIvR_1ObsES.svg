<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="t d"><title id="t">Stream-abort regression matrix</title><desc id="d">Abort points compared against Conversation persistence, side effects, and next-turn behavior</desc><rect width="1440" height="900" fill="#020617"/><text x="720" y="82" text-anchor="middle" fill="#fff" font-size="54" font-family="Arial,sans-serif" font-weight="800">How Do You Prove the Fix Is Safe?</text><text x="720" y="130" text-anchor="middle" fill="#94a3b8" font-size="26" font-family="Arial,sans-serif">The same failure matrix must inspect Conversation state, the ledger, and the external system.</text><g font-family="Arial,sans-serif"><rect x="80" y="205" width="1280" height="500" rx="24" fill="#06162e" stroke="#2563eb" stroke-width="2"/><rect x="80" y="205" width="1280" height="90" rx="24" fill="#0d2447"/><g fill="#fff" font-size="25" font-weight="700" text-anchor="middle"><text x="220" y="260">Abort point</text><text x="500" y="260">Call persisted</text><text x="750" y="260">Side effects</text><text x="990" y="260">Old output</text><text x="1220" y="260">Decision</text></g><g stroke="#334155" stroke-width="2"><path d="M80 295H1360M80 395H1360M80 495H1360M80 595H1360"/><path d="M350 205V705M640 205V705M860 205V705M1110 205V705"/></g><g font-size="24" text-anchor="middle"><g fill="#cbd5e1"><text x="220" y="355">after output_item.added</text><text x="220" y="455">after arguments.done</text><text x="220" y="555">after response.completed</text><text x="220" y="655">duplicate delivery ×2</text></g><g fill="#fb5b45"><text x="500" y="355">measure</text><text x="500" y="455">measure</text></g><text x="500" y="555" fill="#22c55e">expected yes</text><text x="500" y="655" fill="#22c55e">expected yes</text><text x="750" y="355" fill="#22c55e">0</text><text x="750" y="455" fill="#22c55e">0</text><text x="750" y="555" fill="#22c55e">1</text><text x="750" y="655" fill="#22c55e">1 after idempotency</text><text x="990" y="355" fill="#fbbf24">measure</text><text x="990" y="455" fill="#fbbf24">measure</text><text x="990" y="555" fill="#22c55e">accepted</text><text x="990" y="655" fill="#22c55e">reuse result</text><text x="1220" y="355" fill="#fb5b45">no commit, no execute</text><text x="1220" y="455" fill="#fb5b45">no commit, no execute</text><text x="1220" y="555" fill="#22c55e">baseline</text><text x="1220" y="655" fill="#22c55e">business exactly-once</text></g></g><rect x="130" y="755" width="1180" height="95" rx="22" fill="#071a33" stroke="#2563eb" stroke-width="2"/><text x="720" y="805" text-anchor="middle" fill="#fbbf24" font-size="33" font-family="Arial,sans-serif" font-weight="800">Re-run this matrix after SDK, proxy timeout, or cancellation changes.</text><text x="720" y="837" text-anchor="middle" fill="#cbd5e1" font-size="21" font-family="Arial,sans-serif">Unit tests validate the app state machine; live integration tests validate the current API boundary.</text></svg>