<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="t d"><title id="t">Tool Call 生产状态机</title><desc id="d">从流式观察到模型确认的状态机，以及中断、未知和人工对账分支</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset="1" stop-color="#071a33"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#38bdf8"/></marker></defs><rect width="1440" height="900" fill="url(#bg)"/><text x="720" y="82" text-anchor="middle" fill="#fff" font-size="54" font-family="Arial,'Noto Sans SC',sans-serif" font-weight="800">高风险 Tool Call 应该经过哪些状态？</text><text x="720" y="128" text-anchor="middle" fill="#94a3b8" font-size="26" font-family="Arial,'Noto Sans SC',sans-serif">Conversation 负责模型上下文，业务账本负责外部事实</text><g font-family="Arial,'Noto Sans SC',sans-serif" text-anchor="middle"><g fill="#06162e" stroke="#2563eb" stroke-width="3"><rect x="80" y="250" width="185" height="115" rx="20"/><rect x="300" y="250" width="185" height="115" rx="20"/><rect x="520" y="250" width="185" height="115" rx="20"/><rect x="740" y="250" width="185" height="115" rx="20"/><rect x="960" y="250" width="185" height="115" rx="20"/><rect x="1180" y="250" width="185" height="115" rx="20"/></g><g fill="#fff" font-size="25" font-weight="700"><text x="172" y="302">stream_observed</text><text x="392" y="302">call_committed</text><text x="612" y="302">execution_reserved</text><text x="832" y="302">execution_succeeded</text><text x="1052" y="302">output_submitted</text><text x="1272" y="302">model_acknowledged</text></g><g fill="#94a3b8" font-size="20"><text x="172" y="338">仅用于展示</text><text x="392" y="338">对账成功</text><text x="612" y="338">业务幂等占位</text><text x="832" y="338">保存外部结果</text><text x="1052" y="338">结果发回模型</text><text x="1272" y="338">轮次闭环</text></g><g stroke="#38bdf8" stroke-width="5" marker-end="url(#a)"><path d="M265 307H292"/><path d="M485 307H512"/><path d="M705 307H732"/><path d="M925 307H952"/><path d="M1145 307H1172"/></g><g fill="#220b10" stroke="#fb5b45" stroke-width="3"><rect x="130" y="530" width="250" height="100" rx="20"/><rect x="455" y="530" width="250" height="100" rx="20"/><rect x="780" y="530" width="250" height="100" rx="20"/><rect x="1105" y="530" width="250" height="100" rx="20"/></g><g fill="#fb5b45" font-size="24" font-weight="700"><text x="255" y="575">stream_aborted_before_commit</text><text x="580" y="575">commit_unknown</text><text x="905" y="575">execution_unknown</text><text x="1230" y="575">manual_reconciliation_required</text></g><g fill="#cbd5e1" font-size="19"><text x="255" y="608">不执行，丢弃旧 call_id</text><text x="580" y="608">读取 Conversation Items</text><text x="905" y="608">查询外部系统与账本</text><text x="1230" y="608">禁止自动重复副作用</text></g><g stroke="#fb5b45" stroke-width="3" stroke-dasharray="8 7"><path d="M172 365V530"/><path d="M392 365L580 530"/><path d="M832 365L905 530"/><path d="M1052 365L1230 530"/></g></g><rect x="130" y="710" width="1180" height="100" rx="24" fill="#06162e" stroke="#2563eb" stroke-width="2"/><text x="720" y="765" text-anchor="middle" fill="#fbbf24" font-size="34" font-family="Arial,'Noto Sans SC',sans-serif" font-weight="800">安全不变量：未确认 call_committed，不执行外部副作用。</text><text x="720" y="800" text-anchor="middle" fill="#cbd5e1" font-size="22" font-family="Arial,'Noto Sans SC',sans-serif">任何重试先查业务幂等账本，再决定执行、复用结果或进入人工对账</text></svg>