<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="t d"><title id="t">Production tool-call state machine</title><desc id="d">Durable tool-call states and failure branches for stream abort recovery</desc><rect width="1440" height="900" fill="#020617"/><text x="720" y="82" text-anchor="middle" fill="#fff" font-size="54" font-family="Arial,sans-serif" font-weight="800">A Production Tool-Call State Machine</text><text x="720" y="128" text-anchor="middle" fill="#94a3b8" font-size="26" font-family="Arial,sans-serif">Conversation owns model context; the business ledger owns external facts.</text><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#06162e" stroke="#2563eb" stroke-width="3"><rect x="65" y="245" width="195" height="120" rx="20"/><rect x="285" y="245" width="195" height="120" rx="20"/><rect x="505" y="245" width="195" height="120" rx="20"/><rect x="725" y="245" width="195" height="120" rx="20"/><rect x="945" y="245" width="195" height="120" rx="20"/><rect x="1165" y="245" width="210" height="120" rx="20"/></g><g fill="#fff" font-size="23" font-weight="700"><text x="162" y="300">stream_observed</text><text x="382" y="300">call_committed</text><text x="602" y="300">execution_reserved</text><text x="822" y="300">execution_succeeded</text><text x="1042" y="300">output_submitted</text><text x="1270" y="300">model_acknowledged</text></g><g fill="#94a3b8" font-size="19"><text x="162" y="336">UI only</text><text x="382" y="336">reconciled</text><text x="602" y="336">idempotency lock</text><text x="822" y="336">external result stored</text><text x="1042" y="336">sent to model</text><text x="1270" y="336">workflow closed</text></g><g stroke="#38bdf8" stroke-width="5"><path d="M260 305H285M480 305H505M700 305H725M920 305H945M1140 305H1165"/></g><g fill="#220b10" stroke="#fb5b45" stroke-width="3"><rect x="110" y="520" width="270" height="105" rx="20"/><rect x="430" y="520" width="270" height="105" rx="20"/><rect x="750" y="520" width="270" height="105" rx="20"/><rect x="1070" y="520" width="270" height="105" rx="20"/></g><g fill="#fb5b45" font-size="22" font-weight="700"><text x="245" y="565">stream_aborted_before_commit</text><text x="565" y="565">commit_unknown</text><text x="885" y="565">execution_unknown</text><text x="1205" y="565">manual_reconciliation_required</text></g><g fill="#cbd5e1" font-size="18"><text x="245" y="603">discard stale call_id</text><text x="565" y="603">read Conversation Items</text><text x="885" y="603">query ledger and provider</text><text x="1205" y="603">never re-run blindly</text></g><g stroke="#fb5b45" stroke-width="3" stroke-dasharray="8 7"><path d="M162 365V520"/><path d="M382 365L565 520"/><path d="M822 365L885 520"/><path d="M1042 365L1205 520"/></g></g><rect x="130" y="710" width="1180" height="100" rx="24" fill="#06162e" stroke="#2563eb" stroke-width="2"/><text x="720" y="765" text-anchor="middle" fill="#fbbf24" font-size="34" font-family="Arial,sans-serif" font-weight="800">Safety invariant: no external side effect before call_committed.</text><text x="720" y="800" text-anchor="middle" fill="#cbd5e1" font-size="22" font-family="Arial,sans-serif">Every retry checks the business ledger before execute, reuse, or manual reconciliation.</text></svg>